<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Capacity">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<title>Capacity Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E7DFD1; --surface:#F3EDE2; --card:#FFFCF6; --card-alt:#F4EDE0; --card-soft:#EDE4D4;
  --ink:#241F1A; --muted:#8B8175; --label:#A09586; --faint:#B0A597;
  --accent:#B85C3C; --accent-dark:#95462B; --accent-soft:#F1EADD;
  --sage:#6F7F5F; --gold:#E9A03F; --border:#E4DACA; --pill:#E7DECE;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Hanken Grotesk',system-ui,sans-serif; background:var(--bg); color:var(--ink);
  min-height:100vh; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(env(safe-area-inset-bottom) + 88px);
}
a{color:var(--accent)}
input{font-family:inherit}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
button{font-family:inherit}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.shell{max-width:560px;margin:0 auto;background:var(--surface);min-height:100vh;position:relative}
.content{padding:28px 20px 40px}

/* ---- Loading / Auth ---- */
.center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.auth-card{width:100%;max-width:380px;background:var(--card);border-radius:26px;padding:32px 26px;box-shadow:0 2px 3px rgba(60,45,25,.04),0 12px 30px -18px rgba(60,45,25,.35)}
.auth-title{font-family:'Instrument Serif',serif;font-size:32px;line-height:1.1;margin-bottom:6px}
.auth-sub{font-size:14px;color:var(--muted);margin-bottom:22px}
.field-label{font-size:12px;font-weight:600;color:var(--label);margin-bottom:6px;display:block}
.field{width:100%;box-sizing:border-box;height:48px;border-radius:13px;border:1.5px solid var(--border);background:#FBF7EF;padding:0 14px;font-size:15px;color:var(--ink);outline:none;margin-bottom:14px}
.field:focus{border-color:var(--accent)}
.pw-hint{font-size:11.5px;color:var(--faint);margin-top:-10px;margin-bottom:14px}
.btn-primary{width:100%;height:50px;border:none;border-radius:15px;background:var(--ink);color:#FBF7F0;font-size:15.5px;font-weight:600;cursor:pointer;margin-top:4px}
.btn-primary:disabled{opacity:.6;cursor:default}
.btn-text{width:100%;background:none;border:none;color:var(--accent);font-size:13.5px;font-weight:600;cursor:pointer;margin-top:14px;padding:6px}
.auth-msg{font-size:13px;margin-top:10px;padding:10px 12px;border-radius:11px}
.auth-msg.err{background:#FBE9E3;color:var(--accent-dark)}
.auth-msg.ok{background:#EAF1E6;color:var(--sage)}

/* ---- Header / labels ---- */
.label-sm{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--label)}
.title-serif{font-family:'Instrument Serif',serif;line-height:1.05}
.top-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px}
.avatar{width:44px;height:44px;border-radius:22px;background:#E4DACA;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:#7C7264;flex-shrink:0}

/* ---- Cards ---- */
.card{background:var(--card);border-radius:26px;padding:22px;box-shadow:0 2px 3px rgba(60,45,25,.04),0 12px 30px -18px rgba(60,45,25,.35)}
.card-row{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.dot{width:7px;height:7px;border-radius:4px;background:var(--accent)}
.accent-label{font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--accent)}
.next-name{font-family:'Instrument Serif',serif;font-size:34px;line-height:1.1}
.next-sub{font-size:14.5px;color:var(--muted);margin-top:6px;line-height:1.45}
.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 20px}
.tag-pill{font-size:12.5px;font-weight:500;color:#6E6357;background:var(--accent-soft);border-radius:9px;padding:6px 10px}
.cta{background:var(--ink);color:#FBF7F0;border-radius:16px;height:54px;display:flex;align-items:center;justify-content:center;gap:9px;font-size:16.5px;font-weight:600;cursor:pointer;border:none;width:100%}
.cta:hover{background:#3A322A}
.cta[disabled]{opacity:.5;cursor:default}

.stat-grid{display:flex;gap:12px;margin-top:14px}
.stat-card{flex:1;background:var(--card);border-radius:20px;padding:16px 16px 14px}
.stat-card.dark{background:var(--ink);color:#FBF7F0}
.stat-card .lab{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--label)}
.stat-card.dark .lab{color:rgba(251,247,240,.6)}
.stat-num-row{display:flex;align-items:baseline;gap:5px;margin-top:6px}
.stat-num{font-size:30px;font-weight:600;letter-spacing:-.02em}
.stat-unit{font-size:13px;color:var(--muted)}
.stat-card.dark .stat-unit{color:rgba(251,247,240,.65)}

.section-head{margin-top:26px;display:flex;align-items:baseline;justify-content:space-between}
.section-sub{font-size:12.5px;color:var(--muted)}

.day-row{background:var(--card);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;border:none;width:100%;text-align:left;margin-top:8px}
.day-row:hover{background:#FFF9EF}
.day-tick{width:22px;height:22px;border-radius:11px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;color:#FBF7F0;font-weight:700;flex-shrink:0}
.day-body{flex:1;min-width:0}
.day-name{font-size:15.5px;font-weight:600}
.day-sub{font-size:12.5px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day-right{font-size:13px;color:var(--faint);flex-shrink:0}

.note-card{margin-top:24px;background:var(--card-soft);border-radius:20px;padding:16px 18px}
.note-title{font-family:'Instrument Serif',serif;font-size:19px;margin-bottom:6px}
.note-body{font-size:13.5px;line-height:1.5;color:#6E6357}

.empty{background:var(--card);border-radius:22px;padding:34px 20px;text-align:center}
.empty .big{font-size:34px;margin-bottom:10px}
.empty p{font-size:14px;color:var(--muted);margin-top:6px;line-height:1.5}
.empty a{font-weight:600;cursor:pointer}

/* ---- lift cards / records ---- */
.lift-card{background:var(--card);border-radius:20px;padding:16px 18px;cursor:pointer;margin-top:10px;border:1.5px solid transparent}
.lift-card:hover{background:#FFF9EF}
.lift-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.lift-name-row{display:flex;align-items:center;gap:7px}
.lift-name{font-size:15.5px;font-weight:600;line-height:1.25}
.badge{font-size:9.5px;font-weight:700;letter-spacing:.09em;color:#FBF7F0;background:var(--accent);border-radius:6px;padding:3px 6px}
.lift-cur{font-size:12.5px;color:var(--muted);margin-top:3px}
.lift-delta{font-size:13px;font-weight:600;text-align:right}
.lift-delta-sub{font-size:11px;color:var(--faint);margin-top:2px;text-align:right}
.spark-row{display:flex;align-items:center;gap:10px;margin-top:13px}
.spark{display:flex;align-items:flex-end;gap:3px;height:26px}
.spark div{width:7px;border-radius:2px;background:#DCCFB8}
.dots-row{flex:1;display:flex;align-items:center;gap:4px;justify-content:flex-end}
.dots-row .d{width:8px;height:8px;border-radius:5px}
.range-label{font-size:11.5px;color:var(--label);margin-left:5px}

.rec-card{border-radius:20px;padding:16px 18px;cursor:pointer;margin-top:10px;border:1.5px solid transparent}
.rec-card:hover{background:#FFF9EF}
.rec-when{font-size:12.5px;color:var(--muted);margin-top:3px}
.rec-best{font-size:18px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;text-align:right}
.rec-reps{font-size:11.5px;color:var(--faint);margin-top:2px;text-align:right}
.rec-foot{display:flex;gap:14px;margin-top:12px;padding-top:11px;border-top:1px solid rgba(36,31,26,.07)}
.rec-foot .f{flex:1}
.rec-foot .lab{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.rec-foot .val{font-size:14px;font-weight:600;margin-top:2px}

/* ---- volume chart ---- */
.vol-bars{display:flex;align-items:flex-end;gap:9px;height:96px;margin-top:18px}
.vol-bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px}
.vol-bars .bar{width:100%;border-radius:7px;background:var(--border)}
.vol-bars .bar.now{background:var(--accent)}
.vol-bars .lab{font-size:10.5px;color:var(--label);font-weight:500}

/* ---- history ---- */
.hist-card{background:var(--card);border-radius:20px;padding:16px 18px;margin-top:10px}
.hist-top{display:flex;align-items:center;gap:12px;cursor:pointer}
.hist-title{font-size:15.5px;font-weight:600}
.hist-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.hist-chev{font-size:12.5px;color:var(--faint)}
.hist-lines{margin-top:12px;padding-top:12px;border-top:1px solid rgba(36,31,26,.08);display:flex;flex-direction:column;gap:7px}
.hist-line{display:flex;justify-content:space-between;gap:12px;font-size:13.5px}
.hist-line .n{color:#6E6357;flex:1}
.hist-line .v{font-weight:600;font-variant-numeric:tabular-nums}
.sync-banner{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--card-soft);color:#6E6357;font-size:12.5px;line-height:1.4;padding:10px 20px;position:sticky;top:0;z-index:25}
.sync-retry-btn{background:none;border:1.5px solid #6E6357;border-radius:9px;color:#6E6357;font-size:11.5px;font-weight:600;padding:5px 10px;cursor:pointer;flex-shrink:0}
.pending-badge{font-size:9.5px;font-weight:700;letter-spacing:.09em;color:#6E6357;background:var(--card-alt);border:1px solid var(--border);border-radius:6px;padding:3px 6px}
.hist-pending-note{margin-top:10px;font-size:12px;color:var(--muted);font-style:italic}
.hist-actions{display:flex;gap:16px;margin-top:10px}
.hist-del{background:none;border:none;color:var(--faint);font-size:12px;cursor:pointer;padding:4px 0}
.hist-del:hover{color:var(--accent)}
.hist-edit{background:none;border:none;color:var(--accent);font-size:12px;font-weight:600;cursor:pointer;padding:4px 0}
.log-past-btn{width:100%;background:none;border:1.5px dashed var(--border);border-radius:16px;padding:14px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;margin-bottom:16px}
.log-past-btn:hover{color:var(--accent);border-color:var(--accent)}
.day-pick-btn{background:var(--card);border-radius:16px;padding:16px 18px;display:flex;align-items:center;gap:12px;cursor:pointer;border:none;width:100%;text-align:left;margin-top:10px}
.day-pick-btn:hover{background:#FFF9EF}
.editor-set-row{display:flex;gap:8px;align-items:center;margin-bottom:7px}
.set-remove-btn{width:34px;height:46px;border-radius:13px;background:none;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--faint);cursor:pointer;flex-shrink:0}
.set-remove-btn:hover{color:var(--accent);border-color:var(--accent)}
.add-set-link{background:none;border:1.5px dashed var(--border);border-radius:12px;padding:9px;width:100%;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;margin-top:2px}
.add-set-link:hover{color:var(--accent);border-color:var(--accent)}
.date-field{width:100%;box-sizing:border-box;height:48px;border-radius:13px;border:1.5px solid var(--border);background:#FBF7EF;padding:0 14px;font-size:15px;color:var(--ink);outline:none}
.editor-ex-block{margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.editor-ex-block:first-child{margin-top:0;padding-top:0;border-top:none}

/* ---- tab bar ---- */
.tab-bar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center}
.tab-bar-inner{width:100%;max-width:560px;padding:10px 14px calc(env(safe-area-inset-bottom) + 14px);background:linear-gradient(180deg,rgba(231,223,209,0) 0%,var(--bg) 32%);display:flex;gap:8px}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0;border-radius:16px;cursor:pointer;border:none;background:transparent}
.tab-item.active{background:var(--pill)}
.tab-ring{width:18px;height:18px;border-radius:9px;border:2px solid var(--faint)}
.tab-item.active .tab-ring{border-color:var(--ink)}
.tab-label{font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--faint)}
.tab-item.active .tab-label{color:var(--ink)}

/* ---- overlays / session ---- */
.overlay{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:var(--surface)}
.overlay.entering{animation:rise .24s ease}
.overlay-inner{max-width:560px;margin:0 auto;width:100%;height:100%;display:flex;flex-direction:column}
.ov-head{padding:22px 20px 12px}
.ov-head-row{display:flex;align-items:flex-start;gap:12px}
.back-btn{width:38px;height:38px;border-radius:19px;background:#E7DECE;display:flex;align-items:center;justify-content:center;font-size:16px;color:#6E6357;cursor:pointer;flex-shrink:0;border:none}
.ov-scroll{flex:1;overflow-y:auto;padding:4px 20px 40px}

.ex-card{background:var(--card);border-radius:22px;padding:16px 16px 14px;margin-bottom:10px;border:1.5px solid transparent}
.ex-card.done{background:#F7F3E9}
.ex-card.open{border-color:#E4D8C2}
.ex-top{display:flex;align-items:flex-start;gap:11px;cursor:pointer}
.ex-badge{width:24px;height:24px;border-radius:12px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:#A0958E;flex-shrink:0;margin-top:1px}
.ex-badge.done{background:var(--sage);border-color:var(--sage);color:#FBF7F0}
.ex-name{font-size:16px;font-weight:600;line-height:1.25}
.ex-prescription{font-size:12.5px;color:var(--muted);margin-top:2px}
.ex-chev{font-size:12px;color:var(--faint);margin-top:3px}
.hint-row{display:flex;align-items:center;gap:7px;background:var(--card-alt);border-radius:12px;padding:9px 11px;margin:13px 0 12px}
.hint-tag{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--accent)}
.hint-text{font-size:12.5px;color:#6E6357;line-height:1.35;flex:1}
.set-headers{display:flex;gap:8px;padding:0 2px 6px;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.set-row{display:flex;gap:8px;align-items:center;margin-bottom:7px}
.set-num{width:26px;font-size:13.5px;font-weight:600;color:var(--label);font-variant-numeric:tabular-nums}
.set-input-wrap{flex:1;position:relative}
.set-input{width:100%;box-sizing:border-box;height:46px;border-radius:13px;border:1.5px solid #E9DFCD;background:#FBF7EF;padding:0 12px;font-size:16px;font-weight:600;color:var(--ink);outline:none;font-variant-numeric:tabular-nums}
.set-input:focus{border-color:var(--accent)}
.set-input.filled{border-color:#D5DEC9;background:#F1F4EC}
.unit-suffix{position:absolute;right:11px;top:14px;font-size:12px;color:var(--faint);pointer-events:none}
.done-btn{width:34px;height:46px;border-radius:13px;background:#F1EADD;display:flex;align-items:center;justify-content:center;font-size:15px;color:#C3B8A7;cursor:pointer;flex-shrink:0;border:none}
.done-btn.on{background:var(--sage);color:#FBF7F0}
.rpe-row{display:flex;align-items:center;gap:8px;margin-top:14px}
.rpe-label{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--faint)}
.rpe-pills{display:flex;gap:5px;flex:1}
.rpe-pill{flex:1;height:32px;border-radius:10px;background:#F1EADD;color:#8B8175;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;cursor:pointer;border:none}
.rpe-pill.on{background:var(--accent);color:#FBF7F0}
.note-input{width:100%;box-sizing:border-box;height:40px;margin-top:9px;border-radius:12px;border:1.5px dashed #DDD2C0;background:transparent;padding:0 12px;font-size:13.5px;color:var(--ink);outline:none}
.note-input:focus{border-color:var(--accent);border-style:solid}

.sess-progress{height:5px;border-radius:3px;background:#E4DACA;margin-top:14px;overflow:hidden}
.sess-progress-fill{height:100%;border-radius:3px;background:var(--accent);transition:width .3s ease}
.sess-foot{position:sticky;bottom:0;padding:12px 20px calc(env(safe-area-inset-bottom) + 24px);background:linear-gradient(180deg,rgba(243,237,226,0) 0%,var(--surface) 26%)}
.finish-btn{height:56px;border-radius:18px;color:#FBF7F0;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16.5px;font-weight:600;cursor:pointer;border:none;width:100%}

/* ---- exercise detail ---- */
.det-stat-row{display:flex;gap:14px}
.det-stat{flex:1}
.det-stat .lab{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.det-stat .val{font-size:20px;font-weight:600;margin-top:3px;letter-spacing:-.01em}
.det-chart{display:flex;align-items:flex-end;gap:7px;height:80px;margin-top:20px}
.det-chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;border:none;background:none}
.det-chart .top{font-size:9.5px;font-weight:600;font-variant-numeric:tabular-nums}
.det-chart .bar{width:100%;border-radius:6px}
.det-chart .lab{font-size:10px;font-weight:500}
.chip-row{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:9px 14px;border-radius:13px;font-size:13.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;border:none}
.chip-dot{width:6px;height:6px;border-radius:4px}
.sel-card{background:var(--card);border-radius:22px;padding:18px;margin-top:14px}
.sel-set-headers{display:flex;gap:8px;margin:15px 0 7px;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.sel-set-row{display:flex;gap:8px;align-items:center;border-radius:11px;padding:9px 10px}
.sel-set-row + .sel-set-row{margin-top:6px}
.sel-stat-row{display:flex;gap:10px;margin-top:14px}
.sel-stat{flex:1;background:var(--card-alt);border-radius:13px;padding:11px 13px}
.sel-note{margin-top:12px;font-size:13.5px;color:#6E6357;line-height:1.45;border-left:2px solid #E4D8C2;padding-left:11px}
.week-row{display:flex;align-items:center;gap:12px;border-radius:15px;padding:13px 15px;cursor:pointer;margin-top:7px;border:1.5px solid transparent;background:var(--card)}

/* ---- done sheet ---- */
.sheet-backdrop{position:fixed;inset:0;z-index:60;background:rgba(36,31,26,.42);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease}
.sheet{width:100%;max-width:560px;background:var(--card);border-radius:30px 30px 0 0;padding:30px 22px calc(env(safe-area-inset-bottom) + 30px);animation:rise .3s ease}
.sheet-handle{width:38px;height:4px;border-radius:2px;background:#E4DACA;margin:0 auto 20px}
.pr-row{display:flex;align-items:center;gap:10px;background:var(--ink);border-radius:14px;padding:12px 14px;margin-top:7px}
.pr-tag{font-size:9.5px;font-weight:700;letter-spacing:.09em;color:var(--ink);background:var(--gold);border-radius:6px;padding:3px 6px}
.pr-name{flex:1;font-size:14px;font-weight:600;color:#FBF7F0}
.pr-val{font-size:13px;color:#C9BFB0;font-variant-numeric:tabular-nums}

/* ---- settings ---- */
.set-section{margin-top:22px}
.set-day-card{background:var(--card);border-radius:20px;padding:16px 18px;margin-top:12px}
.set-day-head{display:flex;align-items:center;gap:10px}
.set-day-name-input{flex:1;border:none;background:none;font-size:17px;font-weight:600;color:var(--ink);outline:none;border-bottom:1.5px solid transparent;padding:2px 0}
.set-day-name-input:focus{border-bottom-color:var(--accent)}
.icon-btn{width:32px;height:32px;border-radius:10px;background:var(--card-alt);border:none;color:var(--muted);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn:hover{color:var(--accent)}
.ex-list-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--border)}
.ex-list-row .info{flex:1;cursor:pointer}
.ex-list-row .nm{font-size:14.5px;font-weight:600}
.ex-list-row .meta{font-size:12px;color:var(--muted);margin-top:1px}
.add-ex-btn{width:100%;background:none;border:1.5px dashed var(--border);border-radius:13px;padding:11px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;margin-top:10px}
.add-ex-btn:hover{color:var(--accent);border-color:var(--accent)}
.add-day-btn{width:100%;background:none;border:1.5px dashed var(--border);border-radius:16px;padding:14px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;margin-top:14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checkline{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);margin-top:4px;cursor:pointer}
.checkline input{width:16px;height:16px}
.form-actions{display:flex;gap:10px;margin-top:18px}
.btn-secondary{flex:1;height:48px;border-radius:14px;border:1.5px solid var(--border);background:none;color:var(--muted);font-size:14.5px;font-weight:600;cursor:pointer}
.btn-danger{background:none;border:none;color:#B85C3C;font-size:13px;font-weight:600;cursor:pointer;padding:6px 0}
.profile-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border-radius:16px;padding:14px 16px;margin-top:10px}
.profile-row input{width:80px;height:38px;border-radius:10px;border:1.5px solid var(--border);background:#FBF7EF;padding:0 10px;font-size:15px;text-align:right}
.signout-btn{width:100%;margin-top:24px;height:48px;border-radius:14px;background:none;border:1.5px solid var(--border);color:var(--accent);font-weight:600;font-size:14.5px;cursor:pointer}

*::-webkit-scrollbar{display:none}
</style>
</head>
